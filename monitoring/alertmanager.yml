global:
  resolve_timeout: 5m

route:
  receiver: aiops-agent-webhook
  group_by:
    - alertname
    - job
  group_wait: 3s
  group_interval: 30s
  repeat_interval: 5m

receivers:
  - name: aiops-agent-webhook
    webhook_configs:
      - url: http://host.docker.internal:9900/api/alerts/webhook
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - alertname="SmartLifeServiceDown"
    target_matchers:
      - alertname=~"RedisUnavailable|MysqlUnavailable"
    equal:
      - service
