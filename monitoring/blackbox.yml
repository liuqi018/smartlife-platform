modules:
  smartlife_redis_health:
    prober: http
    timeout: 5s
    http:
      valid_status_codes:
        - 200
      fail_if_body_not_matches_regexp:
        - '^UP$'

  smartlife_mysql_health:
    prober: http
    timeout: 5s
    http:
      valid_status_codes:
        - 200
      fail_if_body_not_matches_regexp:
        - '^UP$'