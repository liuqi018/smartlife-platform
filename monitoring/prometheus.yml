global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  - job_name: "smartlife"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:8081"


  # Redis 独立健康检查
  - job_name: "smartlife-health-redis"
    metrics_path: /probe
    params:
      module:
        - smartlife_redis_health
    static_configs:
      - targets:
          - "http://host.docker.internal:8081/api/health/redis"

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115



  # MySQL 独立健康检查
  - job_name: "smartlife-health-mysql"
    metrics_path: /probe
    params:
      module:
        - smartlife_mysql_health
    static_configs:
      - targets:
          - "http://host.docker.internal:8081/api/health/mysql"

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115